<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umman - Bienvenido a bordo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .bg-umman {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            position: relative;
            overflow: hidden;
        }
        /* Simulación de las formas orgánicas del diseño */
        .abstract-shape {
            position: absolute;
            opacity: 0.6;
            filter: blur(40px);
        }
    </style>
</head>
<body class="bg-gray-50 flex min-h-screen">

    <div class="hidden lg:flex w-1/3 bg-umman p-12 flex-col justify-between text-white relative">
        <div class="relative z-10">
            <h1 class="text-2xl font-bold italic tracking-tighter">umman</h1>
        </div>

        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-full h-full opacity-40 bg-center bg-no-repeat bg-contain" style="background-image: url('https://via.placeholder.com/800x1200/000000/FFFFFF?text=Abstracción+Visual');"></div>
        </div>

        <div class="relative z-10">
            <p class="text-3xl font-light mb-8 italic">
                “Menos gestión,<br>
                <span class="font-bold">más inspiración”</span>
            </p>
            
            <div class="space-y-4 text-sm opacity-90">
                <p>Conversa con nosotros:</p>
                <p>hola@umman.es<br>(+34) 641 01 39 59</p>
                <div class="flex space-x-4 pt-4">
                    <a href="#"><i class="fab fa-instagram text-xl"></i></a>
                    <a href="#"><i class="fab fa-facebook text-xl"></i></a>
                    <a href="#"><i class="fab fa-tiktok text-xl"></i></a>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full lg:w-2/3 flex items-center justify-center p-8 bg-white">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-slate-800">¡Bienvenido <span class="font-normal italic">a bordo!</span></h2>
                <p class="text-slate-500 mt-2 text-sm">Tu negocio no necesita más horas, necesita mejores procesos.</p>
            </div>

            <form action="#" method="POST" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">Correo</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@humman.es" 
                        class="w-full px-4 py-3 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="****************" 
                        class="w-full px-4 py-3 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center cursor-pointer">
                        <div class="relative">
                            <input type="checkbox" class="sr-only peer">
                            <div class="w-10 h-5 bg-slate-300 rounded-full peer peer-checked:bg-indigo-600"></div>
                            <div class="dot absolute left-1 top-1 bg-white w-3 h-3 rounded-full transition peer-checked:translate-x-5"></div>
                        </div>
                        <span class="ml-3 text-slate-600">Recordar mis datos</span>
                    </label>
                    <a href="#" class="text-indigo-600 font-semibold hover:underline">Recuperar contraseña</a>
                </div>

                <div class="space-y-3 pt-4">
                    <button type="submit" class="w-full bg-[#5831fb] text-white py-3 rounded-md font-semibold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">
                        Ingresar
                    </button>
                    <button type="button" class="w-full border border-indigo-600 text-indigo-600 py-3 rounded-md font-semibold hover:bg-indigo-50 transition">
                        Soporte
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
